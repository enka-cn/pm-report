# 看护维护流水线。
#
# 用在「上游/算法团队交付过来，我们长期看护，平时只有零星的 bug 要处理」这类工作上。
# 配套的容器是需求列表里的「看护型项目」：不进时间桶，只在驾驶舱的「看护中」里安静地列着，
# 触发了才在它下面新建一条走这条流水线的需求。
#
# 和开发默认流水线的区别在哪：那套是「从一个需求走到交付」——反串讲 → 开发 → DT → 送测
# → 等待测试报告 → DTS 解单 → 合入，七步还带一堆模板待办。给一个 bug 修复用那个，
# 你会在第二步就放弃用它，然后这个系统就不会被用起来。所以这里只留一条修 bug 真会走的路。
#
# 这是配置文件，直接改就行，改完重启服务生效。
key: maint_default
name: 看护维护流水线
role: maint
stages:
  - key: triage
    name: 定位
    kind: work
    todos:
      - 确认现象与复现步骤
      - 判断影响面（哪些版本 / 平台受影响）
  - key: fix
    name: 修复
    kind: work
    todos:
      - 定位根因
      - 改代码
      - 自验证
  - key: verify
    name: 验证
    kind: work
    todos:
      - 回归测试
      - 确认原问题已解决
  - key: merge
    name: 合入
    kind: work
    todos:
      - 合并分支
      - 同步给提出方

# 如果「修完要等上游确认」这件事经常发生，可以在 verify 后面插一个等待阶段。
# kind=wait 的阶段在**进入时自动创建一条「我被阻塞」的阻塞**（见设计文档 D6），
# 这样「卡在别人那里」就是系统里看得见、算得出天数的事实，而不是你脑子里的印象。
# 把上面 merge 之前的注释去掉就能用：
#
#   - key: wait_upstream
#     name: 等上游确认
#     kind: wait
#     wait_counterparty: 算法侧
#     wait_for: 修复确认
#     todos:
#       - 跟踪上游确认进度
