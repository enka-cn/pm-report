key: dev_default
name: 开发默认流水线
role: dev
stages:
  - key: req_reverse_walkthrough
    name: 需求反串讲
    kind: review
    todos:
      - 理解需求并复述
      - 与 SE 确认理解一致
  - key: coding
    name: 开发
    kind: work
    todos:
      - 详细设计
      - 编码
      - 自验证
  - key: dt
    name: DT
    kind: work
    todos:
      - DT 用例执行
      - 问题单闭环
  - key: submit_test
    name: 送测
    kind: work
    todos:
      - 送测材料准备
      - 正式送测
  # kind=wait 的阶段在进入时自动创建一条 blocked_by_others 阻塞（见设计文档 D6）
  - key: wait_test_report
    name: 等待测试报告
    kind: wait
    wait_counterparty: 测试
    wait_for: 测试报告
    todos:
      - 跟踪测试进度
  - key: dts_fix
    name: DTS 解单
    kind: work
    todos:
      - 问题单分析
      - 修复并验证
      - 回归通过
  - key: merge
    name: 合入
    kind: work
    todos:
      - 代码检视
      - 合入主干
